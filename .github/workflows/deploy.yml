name: Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devops-cloud-deployment:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devops-cloud-deployment:latest \
            .

      - name: Run container
        run: |
          docker run -d \
            --name devops-demo \
            -p 8080:8080 \
            ghcr.io/${{ github.repository_owner }}/devops-cloud-deployment:${{ github.sha }}

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:8080/health

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-cloud-deployment:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-cloud-deployment:latest

      - name: Show container logs
        if: always()
        run: docker logs devops-demo