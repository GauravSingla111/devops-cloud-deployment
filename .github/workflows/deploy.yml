name: Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
  uses: actions/checkout@v4
  with:
    fetch-depth: 1
    submodules: false

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker build \
            -t ${IMAGE_NAME}:${GITHUB_SHA} \
            -t ${IMAGE_NAME}:latest \
            .

      - name: Run container
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker run -d \
            --name devops-demo \
            -p 8080:8080 \
            ${IMAGE_NAME}:${GITHUB_SHA}

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:8080/health

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push ${IMAGE_NAME}:${GITHUB_SHA}
          docker push ${IMAGE_NAME}:latest

      - name: Show container logs
        if: always()
        run: |
          echo "=== Docker containers ==="
          docker ps -a

          echo "=== Container logs ==="
          if docker ps -a --format '{{.Names}}' | grep -q '^devops-demo$'; then
            docker logs devops-demo
          else
            echo "Container devops-demo was not created."
          fi